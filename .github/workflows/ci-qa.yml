name: CI QA

on:
  pull_request:
    branches:
      - QA

  push:
    branches:
      - QA

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Tests and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

  agentes:
    name: Agents - Tests
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      VENV: ${{ github.workspace }}/agentes/.venv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Agents virtual environment
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: agentes/.venv
          key: ${{ runner.os }}-agents-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('agentes/requirements.txt') }}

      - name: Create virtual environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: python -m venv "$VENV"

      - name: Add virtual environment to PATH
        run: echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install CPU-only PyTorch
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: pip install -r agentes/requirements.txt

      - name: Save Agents virtual environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: agentes/.venv
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}

      - name: Restore Hugging Face cache
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
          key: ${{ runner.os }}-hf-${{ hashFiles('agentes/requirements.txt', 'agentes/rag/config.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Run tests
        run: pytest agentes/tests -q

      - name: Save Hugging Face cache
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}
  data-ia:
    name: Data IA - Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Data_IA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Data_IA/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest data_ai/tests -q

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build