[project]
name = "g10-latam-equipo-7-backend"
version = "0.1.0"
description = "BackendAPI de NuevaMente para gestión de documentos y adaptación educativa asistida por IA."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]